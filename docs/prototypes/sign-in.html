<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Task Management prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/prototype.css" rel="stylesheet">
<script src="assets/prototype.js"></script>
</head>
<body data-shell="none" data-states="loaded loading error expired">
<main class="tm-auth">
  <div class="tm-auth-card">
    <span class="tm-brand">
      <svg class="tm-mark" width="34" height="14" viewBox="0 0 34 14" aria-hidden="true"><line x1="6" y1="7" x2="28" y2="7"/><circle class="on" cx="6" cy="7" r="5"/><circle class="on" cx="17" cy="7" r="5"/><circle cx="28" cy="7" r="5"/></svg>
      <span>Task Management</span>
    </span>

    <div class="tm-banner is-info" data-state="expired" role="status">
      <i class="bi bi-clock-history" aria-hidden="true"></i>
      <div>Your session ended after 8 hours. Sign in again to continue.</div>
    </div>

    <h1>Sign in</h1>
    <p class="tm-lead">Use the work email your Admin set up for you.</p>

    <div class="tm-banner is-danger" data-state="error" role="alert">
      <i class="bi bi-exclamation-octagon" aria-hidden="true"></i>
      <div>The email or password is wrong. Check both and try again.</div>
    </div>

    <form id="signInForm" class="tm-panel tm-panel-pad" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" type="email" autocomplete="username" value="youssef.samir@company.local" required>
      </div>
      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" type="password" autocomplete="current-password" value="example-pass" required>
        <div class="form-text">Forgot your password? Ask your Admin to reset it.</div>
      </div>
      <button class="btn btn-primary w-100" type="submit" data-state="loaded error expired">Sign in</button>
      <button class="btn btn-primary w-100" type="button" disabled data-state="loading">
        <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Signing in
      </button>
    </form>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('signInForm').addEventListener('submit', function (e) {
  e.preventDefault();
  TM.setState('loading');
  setTimeout(function () { location.href = 'projects.html'; }, 900);
});
</script>
</body>
</html>
